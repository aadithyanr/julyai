# Google Cloud Build configuration for JulyAI Web Service
steps:
  # Build the Docker image from the backend directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/julyai-core:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/julyai-core:latest'
      - './backend'  # Use backend directory as build context
    dir: '.'  # Run from repo root

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/julyai-core:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'julyai-core'
      - '--image'
      - 'gcr.io/$PROJECT_ID/julyai-core:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'

images:
  - 'gcr.io/$PROJECT_ID/julyai-core:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/julyai-core:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # More CPU for faster builds
